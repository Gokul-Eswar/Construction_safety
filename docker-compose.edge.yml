services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: safety-mqtt
    ports:
      - "1883:1883"
    restart: always
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - safety-net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: safety-web
    depends_on:
      mqtt:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./config.json:/app/config.json
      - ./safety_violations.db:/app/safety_violations.db
    environment:
      - NODE_ENV=production
      - MQTT_HOST=mqtt
      - ENGINE_MODE=native
    networks:
      - safety-net
    restart: always

networks:
  safety-net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
